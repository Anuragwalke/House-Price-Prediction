
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #243b55);
            color: #ffffff;
        }

        .container {
            max-width: 750px;
            margin: auto;
            padding: 30px;
            background: #ffffff;
            color: #182235;
            border-radius: 16px;
            box-shadow: 0 12px 35px #0005;
        }

        h1 {
            text-align: center;
            color: #155eef;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background: #ffffff;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 24px;
            border: none;
            border-radius: 9px;
            background: #155eef;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1047bd;
        }

        .result {
            margin-top: 24px;
            padding: 20px;
            text-align: center;
            background: #e8f8ee;
            border-radius: 10px;
            color: #166534;
        }

        .error {
            margin-top: 20px;
            color: #b91c1c;
            text-align: center;
        }

        @media (max-width: 520px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>🏡 House Price Predictor</h1>
        <p class="subtitle">
            Enter property details to estimate its price.
        </p>

        <form method="POST" action="/">
            <div class="form-grid">

                <div>
                    <label for="area">Area (square feet)</label>
                    <input id="area" name="area" type="number"
                           min="1" step="any" value="5000" required>
                </div>

                <div>
                    <label for="bedrooms">Bedrooms</label>
                    <input id="bedrooms" name="bedrooms" type="number"
                           min="0" value="3" required>
                </div>

                <div>
                    <label for="bathrooms">Bathrooms</label>
                    <input id="bathrooms" name="bathrooms" type="number"
                           min="0" value="2" required>
                </div>

                <div>
                    <label for="stories">Stories</label>
                    <input id="stories" name="stories" type="number"
                           min="0" value="2" required>
                </div>

                <div>
                    <label for="mainroad">Main road access</label>
                    <select id="mainroad" name="mainroad">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div>
                    <label for="guestroom">Guest room</label>
                    <select id="guestroom" name="guestroom">
                        <option value="no">No</option>
                        <option value="yes">Yes</option>
                    </select>
                </div>

                <div>
                    <label for="basement">Basement</label>
                    <select id="basement" name="basement">
                        <option value="no">No</option>
                        <option value="yes">Yes</option>
                    </select>
                </div>

                <div>
                    <label for="hotwaterheating">Hot water heating</label>
                    <select id="hotwaterheating" name="hotwaterheating">
                        <option value="no">No</option>
                        <option value="yes">Yes</option>
                    </select>
                </div>

                <div>
                    <label for="airconditioning">Air conditioning</label>
                    <select id="airconditioning" name="airconditioning">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div>
                    <label for="parking">Parking spaces</label>
                    <input id="parking" name="parking" type="number"
                           min="0" value="1" required>
                </div>

                <div>
                    <label for="prefarea">Preferred area</label>
                    <select id="prefarea" name="prefarea">
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div>
                    <label for="furnishingstatus">Furnishing status</label>
                    <select id="furnishingstatus" name="furnishingstatus">
                        <option value="furnished">Furnished</option>
                        <option value="semi-furnished">Semi-furnished</option>
                        <option value="unfurnished">Unfurnished</option>
                    </select>
                </div>

            </div>

            <button type="submit">Predict House Price</button>
        </form>

        {% if prediction is not none %}
        <div class="result">
            <h2>Estimated House Price</h2>
            <h1>{{ "{:,.0f}".format(prediction) }}</h1>
            <p>This is a machine learning estimate, not a guaranteed market price.</p>
        </div>
        {% endif %}

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </main>
</body>
</html>
